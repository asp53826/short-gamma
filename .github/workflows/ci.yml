name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: uv sync --dev
      - name: Verify Python-generated pricing fixture
        run: uv run python tests/js/make_golden.py --check
      - name: Run deterministic game and parity tests
        run: node --test tests/js/*.test.mjs
